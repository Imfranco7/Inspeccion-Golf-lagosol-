<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f4c3a">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Inspección Golf">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Inspección Golf</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<style>
/* Tema claro, sobrio: superficies blancas, bordes finos, un solo color de marca. */
:root{
  color-scheme: light;
  --bg:#f3f5f7; --surface:#ffffff; --subtle:#f7f8fa; --line:#e2e6ea; --line-2:#cfd5db;
  --text:#1b2530; --text-2:#4a5562; --muted:#7a8592;
  --brand:#0f4c3a; --brand-hover:#0b3b2d; --brand-soft:#e8f0ed; --brand-ink:#0f4c3a;
  --ok:#1b7a47; --ok-soft:#e5f3eb; --bad:#c0362c; --bad-soft:#fcebea; --na:#5d6b7a; --na-soft:#eef1f4; --warn:#b25e09;
  --r:10px; --r-sm:8px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* Barra superior: verde institucional, texto blanco */
.top{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;
  padding:calc(env(safe-area-inset-top) + 10px) max(16px,env(safe-area-inset-right)) 12px max(16px,env(safe-area-inset-left));display:flex;align-items:center;gap:10px}
.top .ttl{flex:1;min-width:0}
.top .ttl b{display:block;font-size:16px;font-weight:600;letter-spacing:-.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl span{display:block;font-size:12px;opacity:.7}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:#fff;background:rgba(255,255,255,.12);border:0;border-radius:999px;padding:6px 10px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.6)}
.sync.ok i{background:#6fe0a3} .sync.error i{background:#ff8a80} .sync.wait i{background:#ffc46b} .sync.run i{background:#ffc46b;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.yo{width:32px;height:32px;border-radius:50%;border:1.5px solid rgba(255,255,255,.5);background:rgba(255,255,255,.12);color:#fff;font-weight:700;font-size:12px;padding:0;flex:none}
.yo:empty{display:none}

main{max-width:720px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right)) calc(150px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:grid;gap:14px}

/* Navegación inferior */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:4px max(6px,env(safe-area-inset-right)) calc(4px + env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left))}
nav.bottom button{flex:1;background:none;border:0;padding:7px 0 5px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted)}
nav.bottom svg{width:22px;height:22px}
nav.bottom button.on{color:var(--brand);font-weight:600}

/* Bloques */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;overflow:hidden}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:20px;font-weight:650;margin:0;letter-spacing:-.2px}
h2{font-size:15px;font-weight:650;margin:0}
.muted{color:var(--muted)} .small{font-size:13px} .xs{font-size:12px}
.lbl{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin:0 0 6px}
.stack{display:grid;gap:12px}
.row{display:flex;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>*{min-width:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--brand);border-radius:var(--r-sm);padding:11px 14px;font-weight:600;font-size:15px;background:var(--brand);color:#fff;width:100%}
.btn:active{background:var(--brand-hover)}
.btn.sec{background:var(--surface);color:var(--brand);border-color:var(--line-2)}
.btn.danger{background:var(--surface);color:var(--bad);border-color:#f0c4bf}
.btn.sm{width:auto;padding:8px 12px;font-size:14px;white-space:nowrap;flex:none}
.link{background:none;border:0;padding:0;color:var(--brand);font-weight:600;font-size:14px}
input.t,textarea.t{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-sm);padding:10px 12px;font-size:16px;outline:none;-webkit-appearance:none;appearance:none;min-height:44px}
input.t:focus,textarea.t:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
textarea.t{min-height:84px;resize:vertical}

/* Control segmentado */
.segc{display:flex;background:var(--subtle);border:1px solid var(--line);border-radius:var(--r-sm);padding:3px;gap:3px}
.segc button{flex:1;border:0;background:transparent;border-radius:6px;padding:9px 6px;font-weight:600;font-size:14px;color:var(--text-2);line-height:1.2}
.segc button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(16,24,40,.12)}

/* Chips de estado */
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.pend{background:var(--na-soft);color:var(--na)}

/* Semana en miniatura */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.week div{text-align:center;font-size:11px;color:var(--muted)}
.week b{display:block;height:8px;border-radius:4px;background:var(--line);margin-bottom:4px}
.week .ok b{background:var(--ok)} .week .mal b{background:var(--bad)} .week .falta b{background:#f3c9c4}
.week .hoy{color:var(--text);font-weight:700}

/* Desplegables */
details.acc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
details.acc>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer;user-select:none}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary .st{flex:1;min-width:0}
details.acc>summary>span{flex:none;display:flex}
details.acc>summary .st b{display:block;font-size:15px;font-weight:600}
details.acc>summary .st span{display:block;font-size:12px;color:var(--muted)}
details.acc>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:-4px 4px 0 2px;transition:transform .15s}
details.acc[open]>summary::after{transform:rotate(-135deg);margin-top:4px}
details.acc[open]>summary{border-bottom:1px solid var(--line)}
.acc-body{padding:4px 14px 14px}
details[data-key=hoja] .acc-body{padding:12px}
.done-ic{width:20px;height:20px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;flex:none}
.done-ic svg{width:12px;height:12px}
.todo-ic{width:20px;height:20px;border-radius:50%;border:2px solid var(--line-2);flex:none}
.bad-ic{background:var(--bad)}

/* Ítems del formulario */
.item{padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item.falta .iname{color:var(--bad)}
.item.falta .opts button{border-color:#f0c4bf}
.iline{display:flex;align-items:center;gap:10px}
.iname{flex:1;min-width:0;font-size:14px;color:var(--text)}
.opts{display:flex;gap:4px;flex:none}
.opts button{width:40px;height:36px;border:1px solid var(--line-2);background:var(--surface);border-radius:7px;font-weight:650;font-size:13px;color:var(--text-2);padding:0}
.opts button.on.B{background:var(--ok);border-color:var(--ok);color:#fff}
.opts button.on.M{background:var(--bad);border-color:var(--bad);color:#fff}
.opts button.on.NA{background:var(--na);border-color:var(--na);color:#fff}
.opts .cam{position:relative;display:grid;place-items:center;width:36px;color:var(--text-2)}
.opts .cam svg{width:18px;height:18px}
.opts .cam input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.opts .cam.has{color:var(--brand);border-color:var(--brand)}
.extra{display:grid;gap:8px;margin-top:8px}
.extra:empty{display:none}
.mini{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2)}
.tog{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;color:var(--text-2)}
.tog.on{background:var(--brand);border-color:var(--brand);color:#fff}
.sec-tools{display:flex;justify-content:flex-end;padding:8px 0 2px}

.fotos{display:flex;gap:6px;flex-wrap:wrap}
.fotos:empty{display:none}
.thumb{position:relative;width:56px;height:56px;border-radius:7px;overflow:hidden;background:var(--subtle);border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .x{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;border:0;background:rgba(17,24,39,.7);color:#fff;font-size:13px;line-height:20px;padding:0}

.progress{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--brand);transition:width .2s}

.savebar{position:fixed;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom));z-index:25;background:var(--surface);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left))}
.savebar .in{max-width:720px;margin:0 auto;display:flex;gap:12px;align-items:center}
.savebar .cnt{font-size:13px;color:var(--text-2);white-space:nowrap;font-variant-numeric:tabular-nums}

.who{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--subtle);border:1px solid var(--line);border-radius:var(--r-sm)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.who .n{flex:1;min-width:0;font-size:14px}
.who .n span{display:block;font-size:12px;color:var(--muted)}

/* Listas */
.li{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .h{font-weight:650;font-variant-numeric:tabular-nums;min-width:46px}
.li .n{flex:1;min-width:0;font-size:14px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tap{cursor:pointer}

/* Hoja semanal */
.weeknav{display:flex;align-items:center;gap:8px}
.weeknav button{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-sm);width:38px;height:38px;font-size:18px;color:var(--text-2);flex:none}
.weeknav button:disabled{opacity:.35}
.weeknav div{flex:1;text-align:center;font-weight:600;font-size:14px}
.weeknav small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.tabla-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);-webkit-overflow-scrolling:touch}
table.hoja{border-collapse:collapse;width:100%;font-size:12.5px;table-layout:fixed}
table.hoja th,table.hoja td{border-bottom:1px solid var(--line);border-left:1px solid var(--line);padding:6px 2px;text-align:center;overflow:hidden;text-overflow:ellipsis;position:relative}
table.hoja .desc{width:128px;text-align:left;padding-left:10px;position:sticky;left:0;background:var(--surface);border-left:0;z-index:1;line-height:1.25;color:var(--text-2)}
@media (min-width:600px){table.hoja .desc{width:230px}}
table.hoja th{font-size:11px;font-weight:600;background:var(--subtle);color:var(--text-2);line-height:1.25;cursor:pointer}
table.hoja th small{display:block;font-weight:400;color:var(--muted);font-size:10px}
table.hoja th.desc{background:var(--subtle);z-index:2}
table.hoja th.hoy{background:var(--brand-soft);color:var(--brand)}
table.hoja tr.sec td{background:var(--subtle);font-weight:600;text-align:left;font-size:11px;color:var(--muted);padding-left:10px;text-transform:uppercase;letter-spacing:.3px}
td.vB{color:var(--ok);font-weight:650} td.vM{background:var(--bad-soft);color:var(--bad);font-weight:700} td.vNA{color:var(--muted)}
td.cf::after{content:"";position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:var(--warn)}
td.fut{background:var(--subtle)}

.kpi{display:grid;gap:2px}
.kpi b{font-size:22px;font-weight:650;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}

.empty{padding:6px 0;color:var(--muted);font-size:14px}
.note{font-size:13px;color:var(--text-2);background:var(--brand-soft);border-radius:var(--r-sm);padding:10px 12px}

/* Inicio */
.hero{display:grid;gap:2px;padding:2px 2px 0}
.hero .saludo{margin:0;font-size:14px;color:var(--text-2)}
.hero h1{font-size:24px;letter-spacing:-.4px}
.hero p{margin:2px 0 0}
.carro{display:grid;gap:14px}
.carro-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.carro-h h2{font-size:17px}
.carro-h p{margin:2px 0 0}
.carro-a{display:flex;gap:8px}
.estado{font-size:12px;font-weight:600;padding:4px 10px;border-radius:6px;white-space:nowrap}
.estado.ok{background:var(--ok-soft);color:var(--ok)} .estado.bad{background:var(--bad-soft);color:var(--bad)} .estado.pend{background:#fff4e5;color:#9a5a00}
/* Tira de días (columnas DÍA 1–7 del formato) */
.dias{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dia{display:grid;justify-items:center;gap:4px}
.dia .m{position:relative;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line-2);color:#fff;background:var(--surface)}
.dia .m svg{width:16px;height:16px}
.dia .m em{position:absolute;top:-5px;right:-6px;font-style:normal;font-size:10px;font-weight:700;background:var(--text);color:#fff;border-radius:999px;min-width:16px;height:16px;line-height:16px;padding:0 4px}
.dia .d{font-size:11px;color:var(--muted)}
.dia.ok .m{background:var(--ok);border-color:var(--ok)}
.dia.mal .m{background:var(--bad);border-color:var(--bad)}
.dia.falta .m{border-style:dashed;border-color:#e3a39d;background:#fdf6f5}
.dia.hoy .m{border:2px solid var(--brand)}
.dia.hoy .d{color:var(--brand);font-weight:700}
.dia.fut .m{background:var(--subtle);border-color:var(--line)}
.leyenda{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:12px;color:var(--muted);margin:0}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda .dot{display:inline-block;width:10px;height:10px;border-radius:50%}
.leyenda .dot.ok{background:var(--ok)} .leyenda .dot.mal{background:var(--bad)} .leyenda .dot.falta{border:1.5px dashed #e3a39d}
/* Listas tocables */
.lista{padding-bottom:4px}
.lista h2{margin-bottom:4px}
button.li{width:100%;background:none;border:0;border-top:1px solid var(--line);text-align:left;color:inherit;font:inherit}
.lista h2+button.li{border-top:0}
.li .n{display:grid;gap:1px;white-space:normal}
.li .n b{font-weight:600;color:var(--text);font-size:14px}
.li .n span{font-size:12px;color:var(--muted)}
.li .chev{width:16px;height:16px;color:var(--muted);flex:none}
.li.tap:active{background:var(--subtle)}
/* Detalle */
.volver{display:inline-flex;align-items:center;gap:2px;background:none;border:0;padding:4px 0;color:var(--brand);font-weight:600;font-size:15px;justify-self:start}
.volver svg{width:18px;height:18px}
.det-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;margin:0}
.meta dt{font-size:12px;color:var(--muted)}
.meta dd{margin:2px 0 0;font-weight:600;font-size:15px}
.meta dd small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.conteo{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.conteo div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid}
.conteo b{font-size:22px;font-weight:650;font-variant-numeric:tabular-nums}
.conteo span{font-size:12px;color:var(--muted)}
.conteo .ok b{color:var(--ok)} .conteo .bad b{color:var(--bad)} .conteo .na b{color:var(--na)}
.novs{border-color:#f1c9c4}
.novs h2{color:var(--bad);margin-bottom:4px}
.nov{display:grid;gap:4px;padding:10px 0;border-top:1px solid var(--line)}
.novs h2+.nov{border-top:0}
.nov p{margin:0;font-size:14px;color:var(--text-2)}
.obs-txt{margin:6px 0 0;font-size:14px;color:var(--text-2);white-space:pre-wrap}
ul.res{list-style:none;margin:0;padding:0}
ul.res li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
ul.res li:first-child{border-top:0}
ul.res li>span{display:grid;gap:6px;min-width:0}
ul.res small{font-size:12px;color:var(--muted)}
ul.res em{font-style:normal;font-weight:700;font-size:12px;min-width:38px;text-align:center;padding:4px 0;border-radius:6px}
ul.res em.vB{background:var(--ok-soft);color:var(--ok)} ul.res em.vM{background:var(--bad);color:#fff} ul.res em.vNA{background:var(--na-soft);color:var(--na)}
.toast{position:fixed;left:50%;bottom:calc(130px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:#1b2530;color:#fff;padding:10px 16px;border-radius:var(--r-sm);font-size:14px;opacity:0;transition:.2s;z-index:60;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.pin{font-size:24px;letter-spacing:10px;text-align:center}
#visor{position:fixed;inset:0;background:rgba(17,24,39,.94);z-index:70;display:none;align-items:center;justify-content:center;padding:20px}
#visor.on{display:flex}
#visor img{max-width:100%;max-height:82vh;border-radius:6px}
#visor p{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#fff;font-size:14px;margin:0}
#print{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  @page{size:landscape;margin:10mm}
  body *{visibility:hidden}
  #print,#print *{visibility:visible}
  #print{display:block;position:absolute;left:0;top:0;width:100%;color:#000;background:#fff;font:10px Arial,sans-serif}
  #print .pg{page-break-after:always}
  #print h1{font-size:15px;text-align:center;margin:0 0 6px}
  #print table{border-collapse:collapse;width:100%}
  #print td,#print th{border:1px solid #000;padding:2px 3px;text-align:center}
  #print td.d{text-align:left}
  #print tr.s td{background:#bbb;font-weight:bold;text-align:left}
  #print .hdr{display:flex;justify-content:space-between;margin-bottom:5px}
}
</style>
</head>
<body>
<header class="top">
  <div class="ttl"><b>Inspección de carros de golf</b><span>Formato FOR-PSB-07</span></div>
  <button class="sync" id="syncPill" data-act="sync" aria-label="Estado de sincronización"><i></i><span>…</span></button>
  <button class="yo" id="yoBtn" data-act="perfil" aria-label="Mis datos"></button>
</header>
<main id="main"></main>
<div id="savebarHost"></div>
<nav class="bottom" id="nav">
  <button data-nav="inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3.5 10.5 12 4l8.5 6.5V20a1 1 0 0 1-1 1h-5v-6h-5v6h-5a1 1 0 0 1-1-1z"/></svg>Inicio</button>

<script>
/* ================== CONFIGURACIÓN ==================
   SUPABASE_URL / SUPABASE_KEY: proyecto de Supabase (Settings → API).
       Si se dejan vacíos, la app funciona solo en este celular.
   ADMIN_PIN: PIN para entrar al panel administrador.            */
const CONFIG = {
  SUPABASE_URL: 'https://vqrksycfstdxcxrpeupc.supabase.co',
  SUPABASE_KEY: 'sb_publishable_Y90l6lncUqF8kN9JDjjfSw_kX8T81jE',
  ADMIN_PIN: '1234',
  CARROS: ['Lencero', 'H5'],
  SEMANAS_SYNC: 12,
  FOTO_MAX: 1280,       // lado mayor de la foto en píxeles
  FOTO_CALIDAD: 0.7
};

/* ================== FORMULARIO (igual al papel) ================== */
const SECCIONES = [
  { t: 'Condiciones externas del vehículo', items: [
    ['motor', 'Estado del motor'],
    ['lat_frente', 'Latonería y pintura frente'],
    ['lat_der', 'Latonería y pintura lado derecho'],
    ['lat_izq', 'Latonería y pintura lado izquierdo'],
    ['lat_tras', 'Latonería y pintura parte trasera'],
    ['lat_techo', 'Latonería y pintura techo'],
    ['llantas', 'Llantas'],
    ['llanta_rep', 'Llantas de repuesto'],
    ['direccion', 'Dirección'],
    ['suspension', 'Suspensión'],
    ['retrovisores', 'Retrovisores'],
    ['gasolina', 'Nivel del tanque de gasolina']]},
  { t: 'Condiciones internas del vehículo', items: [
    ['cojineria', 'Cojinería'],
    ['pisos', 'Pisos'],
    ['techo', 'Techo']]},
  { t: 'Condiciones operativas del vehículo', items: [
    ['aceite', 'Aceite'],
    ['bateria', 'Batería'],
    ['pito', 'Pito'],
    ['luces', 'Luces'],
    ['encendido', 'Encendido'],
    ['pito_rev', 'Pito de reversa'],
    ['aseo', 'Condiciones de aseo'],
    ['desinfeccion', 'Desinfección am - pm'],
    ['conoc_desinf', 'Conocimiento de: desinfectar el carro cada vez que sea utilizado nuevamente por otro usuario']]},
  { t: 'Elementos de seguridad', items: [
    ['extintor', 'Extintor']]}
];
const ITEMS = SECCIONES.flatMap(s => s.items);
const LABEL = Object.fromEntries(ITEMS);
const VALS = [['B', 'Bueno'], ['M', 'Malo'], ['NA', 'No aplica']];
const CARGOS = ['Camarero', 'Anfitrión de servicios'];
const quien = r => `${r.camarero || ''}${r.cargo ? ' · ' + r.cargo : ''}`;
const DIAS = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];
const DIAS_C = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const ICO_CAM = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></svg>';
const ICO_BACK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>';
const ICO_OK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

/* ================== UTILIDADES ================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const hoy = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
const ahoraHM = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const toISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const diaNum = d => ((d.getDay() + 6) % 7) + 1;           // 1 = lunes ... 7 = domingo
const lunesISO = d => toISO(addDays(d, -(diaNum(d) - 1)));
const fechasSemana = lunes => Array.from({length: 7}, (_, i) => toISO(addDays(parseISO(lunes), i)));
const fmtC = iso => { const d = parseISO(iso); return `${d.getDate()} ${MESES[d.getMonth()]}`; };
const fmtL = iso => { const d = parseISO(iso); return `${DIAS[diaNum(d) - 1]} ${d.getDate()} ${MESES[d.getMonth()]}`; };
const hora12 = hm => { if (!hm) return '—'; const [h, m] = hm.split(':').map(Number); return `${((h + 11) % 12) + 1}:${pad(m)} ${h < 12 ? 'a. m.' : 'p. m.'}`; };
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const iniciales = n => (n || '').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('');
const plural = (n, a, b) => `${n} ${n === 1 ? a : b}`;
const store = {
  get(k, def) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch (e) { return def; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
};
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ================== FOTOS (IndexedDB) ================== */
const fotosDB = (() => {
  let dbp;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('ig_fotos', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('f');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const tx = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => {
    const t = db.transaction('f', mode); const req = fn(t.objectStore('f'));
    t.oncomplete = () => res(req && req.result); t.onerror = () => rej(t.error); }); };
  return { get: k => tx('readonly', s => s.get(k)).catch(() => null), set: (k, v) => tx('readwrite', s => s.put(v, k)) };
})();
const fotoCache = {};
async function srcFoto(f) {
  if (fotoCache[f.id]) return fotoCache[f.id];
  const local = await fotosDB.get(f.id);
  if (local) return (fotoCache[f.id] = local);
  if (!f.sub || !conectado() || !navigator.onLine) return '';
  try {
    const rows = await sbGet(`select=datos&id=eq.${encodeURIComponent('foto_' + f.id)}`);
    if (rows[0] && rows[0].datos) {
      fotoCache[f.id] = rows[0].datos;
      fotosDB.set(f.id, rows[0].datos).catch(() => {});
      return rows[0].datos;
    }
  } catch (e) { console.warn(e); }
  return '';
}
function hidratarFotos(root = document) {
  root.querySelectorAll('img[data-foto]:not([data-ok])').forEach(async img => {
    img.dataset.ok = '1';
    const src = await srcFoto({ id: img.dataset.foto, sub: img.dataset.sub === '1' });
    if (src) img.src = src;
  });
}
function comprimir(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const k = Math.min(1, CONFIG.FOTO_MAX / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', CONFIG.FOTO_CALIDAD));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('No se pudo leer la imagen')); };
    img.src = url;
  });
}
const thumbHTML = (f, quitar, titulo) => `<div class="thumb" data-act="verFoto" data-foto="${esc(f.id)}" data-sub="${f.sub ? 1 : 0}" data-titulo="${esc(titulo || '')}">
  <img data-foto="${esc(f.id)}" data-sub="${f.sub ? 1 : 0}" alt="">${quitar ? `<button class="x" data-act="quitarFoto" data-item="${esc(quitar)}" data-foto="${esc(f.id)}" aria-label="Quitar foto">×</button>` : ''}</div>`;

/* ================== ESTADO ================== */
let DB = store.get('ig_records', {});
let ME = store.get('ig_me', null) || { nombre: '', dispositivo: uid() };
store.set('ig_me', ME);
const persist = () => { if (!store.set('ig_records', DB)) toast('Memoria del celular llena'); };
const S = {
  view: 'inicio',
  prevView: 'inicio',
  verId: null,
  semana: lunesISO(hoy()),
  carroSemana: CONFIG.CARROS[0],
  draft: null,
  dirty: false,
  abiertas: new Set([0]),
  admin: sessionStorage.getItem('ig_admin') === '1',
  ultimaSync: store.get('ig_lastsync', null)
};
const activos = () => Object.values(DB).filter(r => !r.eliminado);
const recsDia = (carro, fecha) => activos().filter(r => r.carro === carro && r.fecha === fecha).sort((a, b) => (a.hora || '') < (b.hora || '') ? -1 : 1);
const recsSemana = (lunes, carro) => activos().filter(r => r.semana === lunes && (!carro || r.carro === carro)).sort((a, b) => (a.fecha + a.hora) < (b.fecha + b.hora) ? -1 : 1);
const tieneM = r => Object.values(r.items || {}).includes('M');
const nM = r => Object.values(r.items || {}).filter(v => v === 'M').length;
const nFotos = r => Object.values(r.fotos || {}).reduce((n, a) => n + a.length, 0);
const pendientes = () => Object.values(DB).filter(r => r._pending).length;

/* ================== SINCRONIZACIÓN ================== */
let syncing = false, otraVez = false;
function setSync(cls, txt) { const p = $('#syncPill'); p.className = 'sync ' + cls; p.querySelector('span').textContent = txt; }
function pintarSync() {
  const n = pendientes();
  if (!conectado()) return setSync('', 'Solo local');
  if (!navigator.onLine) return setSync('wait', n ? `Sin red · ${n}` : 'Sin red');
  if (n) return setSync('wait', `${n} por enviar`);
  setSync('ok', 'Al día');
}
const limpio = r => { const c = JSON.parse(JSON.stringify(r)); delete c._pending; delete c._existe; return c; };
/* Base conjunta: una tabla "registros" en Supabase (id text PK, tipo, semana, datos) */
const conectado = () => !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_KEY);
const sbURL = () => CONFIG.SUPABASE_URL.replace(/\/+$/, '') + '/rest/v1/registros';
const sbHead = extra => ({ apikey: CONFIG.SUPABASE_KEY, 'Content-Type': 'application/json', ...(extra || {}) });
async function sbError(r) {
  let m = 'error ' + r.status, code = '';
  try { const j = await r.json(); m = j.message || j.error || j.hint || m; code = j.code || ''; } catch (e) {}
  if (code === '42501' || /row-level security/i.test(m)) m = 'La tabla tiene RLS activado. Desactívalo en Supabase.';
  else if (code === 'PGRST205' || code === '42P01' || r.status === 404) m = 'No existe la tabla "registros" en Supabase.';
  else if (code === 'PGRST204' || code === '42703') m = 'A la tabla le falta una columna (tipo, semana o datos). ' + m;
  else if (code === '22P02') m = 'La columna id debe ser de tipo text. ' + m;
  else if (r.status === 401) m = 'Clave de Supabase no válida.';
  return new Error(m);
}
async function sbUpsert(rows) {
  const r = await fetch(sbURL() + '?on_conflict=id', { method: 'POST', headers: sbHead({ Prefer: 'resolution=merge-duplicates,return=minimal' }), body: JSON.stringify(rows) });
  if (!r.ok) throw await sbError(r);
}
async function sbGet(query) {
  const r = await fetch(sbURL() + '?' + query, { headers: sbHead() });
  if (!r.ok) throw await sbError(r);
  return r.json();
}
async function sbGetTodo(query) {
  const out = [];
  for (let off = 0; ; off += 1000) {
    const rows = await sbGet(`${query}&order=id&limit=1000&offset=${off}`);
    out.push(...rows);
    if (rows.length < 1000) return out;
  }
}
async function subirFotos(rec) {
  for (const arr of Object.values(rec.fotos || {})) {
    for (const f of arr) {
      if (f.sub) continue;
      const data = await fotosDB.get(f.id);
      if (!data) continue;
      await sbUpsert([{ id: 'foto_' + f.id, tipo: 'foto', semana: rec.semana, datos: data }]);
      f.sub = true; persist();
    }
  }
}
async function sync(todo = false, avisar = false) {
  if (!conectado()) { pintarSync(); if (avisar) toast('Sin base conjunta: los datos quedan en este celular'); return; }
  if (!navigator.onLine) { pintarSync(); if (avisar) toast('Sin conexión. Se enviará al volver la red'); return; }
  if (syncing) { otraVez = true; return; }
  syncing = true; otraVez = false; setSync('run', 'Sincronizando');
  try {
    const pend = Object.values(DB).filter(r => r._pending);
    for (const r of pend) await subirFotos(r);
    if (pend.length) {
      const enviados = Object.fromEntries(pend.map(r => [r.id, r.actualizado]));
      await sbUpsert(pend.map(r => ({ id: r.id, tipo: 'insp', semana: r.semana, datos: JSON.stringify(limpio(r)) })));
      Object.keys(enviados).forEach(id => { if (DB[id] && DB[id].actualizado === enviados[id]) delete DB[id]._pending; });
      persist();
    }
    const desde = todo ? '' : toISO(addDays(parseISO(lunesISO(hoy())), -7 * CONFIG.SEMANAS_SYNC));
    const filas = await sbGetTodo(`select=datos&tipo=eq.insp${desde ? '&semana=gte.' + desde : ''}`);
    filas.map(f => { try { return JSON.parse(f.datos); } catch (e) { return null; } }).filter(Boolean).forEach(r => {
      const l = DB[r.id];
      if (!l || (!l._pending && r.actualizado >= l.actualizado)) DB[r.id] = r;
    });
    persist();
    S.ultimaSync = new Date().toISOString(); store.set('ig_lastsync', S.ultimaSync);
    pintarSync();
    if (avisar) toast('Datos al día');
    if (S.view !== 'form' && S.view !== 'perfil') render(true);
  } catch (e) {
    console.warn(e); setSync('error', 'Error');
    if (avisar) toast('No se pudo sincronizar: ' + e.message);
  } finally { syncing = false; if (otraVez) setTimeout(() => sync(todo), 300); }
}

/* ================== PIEZAS DE INTERFAZ ================== */
const segc = (vals, actual, act, id) => `<div class="segc"${id ? ` id="${id}"` : ''}>${vals.map(v => `<button type="button" class="${v === actual ? 'on' : ''}" data-act="${act}" data-v="${esc(v)}">${esc(v)}</button>`).join('')}</div>`;
const ICO_ALERT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M12 6v7M12 17.5v.5"/></svg>';
const ICO_CHEV = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
/* Tira de 7 días, igual a las columnas DÍA 1–7 del formato */
function tiraDias(carro, lunes) {
  const h = toISO(hoy());
  return `<div class="dias" role="list">${fechasSemana(lunes).map((f, i) => {
    const rs = recsDia(carro, f);
    const cls = rs.length ? (rs.some(tieneM) ? 'mal' : 'ok') : f < h ? 'falta' : f === h ? 'hoy' : 'fut';
    const ic = cls === 'ok' ? ICO_OK : cls === 'mal' ? ICO_ALERT : '';
    const txt = cls === 'ok' ? 'sin novedades' : cls === 'mal' ? 'con novedades' : cls === 'falta' ? 'sin registro' : cls === 'hoy' ? 'hoy, pendiente' : 'próximo';
    return `<div class="dia ${cls}" role="listitem" aria-label="${DIAS[i]}: ${txt}"><span class="m">${ic}${rs.length > 1 ? `<em>${rs.length}</em>` : ''}</span><span class="d">${['L', 'M', 'Mi', 'J', 'V', 'S', 'D'][i]}</span></div>`;
  }).join('')}</div>`;
}
const estadoChip = r => tieneM(r) ? `<span class="chip bad">${plural(nM(r), 'novedad', 'novedades')}</span>` : '<span class="chip ok">Sin novedades</span>';
/* Fila de inspección: abre la vista de solo lectura */
const filaInsp = (r, opts = {}) => `<button class="li tap" data-act="ver" data-id="${esc(r.id)}">
  <span class="h">${esc(r.hora || '—')}</span>
  <span class="n"><b>${opts.carro ? 'Carro ' + esc(r.carro) : opts.fecha ? `${DIAS[r.dia - 1]} ${parseISO(r.fecha).getDate()}` : esc(r.camarero)}</b>
    <span>${opts.carro || opts.fecha ? esc(r.camarero) : esc(r.cargo || '')}${nFotos(r) ? `, ${plural(nFotos(r), 'foto', 'fotos')}` : ''}</span></span>
  ${estadoChip(r)}${ICO_CHEV}</button>`;
const puedeEditar = r => !!r && (S.admin || (r.dispositivo && r.dispositivo === ME.dispositivo) || (!!r.camarero && r.camarero === ME.nombre && (r.cargo || '') === (ME.cargo || '')));
function weekNav() {
  const f = fechasSemana(S.semana);
  const actual = S.semana === lunesISO(hoy());
  return `<div class="weeknav">
    <button data-act="semPrev" aria-label="Semana anterior">‹</button>
    <div>${fmtC(f[0])} – ${fmtC(f[6])}<small>${actual ? 'Semana actual' : parseISO(f[0]).getFullYear()}</small></div>
    <button data-act="semNext" aria-label="Semana siguiente" ${actual ? 'disabled' : ''}>›</button>
  </div>`;
}
const acc = (key, titulo, sub, cuerpo, abierto, icono = '') => `<details class="acc" data-key="${key}"${abierto ? ' open' : ''}>
  <summary>${icono}<div class="st"><b>${titulo}</b>${sub ? `<span>${sub}</span>` : ''}</div></summary>
  <div class="acc-body">${cuerpo}</div></details>`;

/* ================== VISTAS ================== */
function vPerfil() {
  const editando = !!(ME.nombre && ME.cargo);
  return `<div class="card stack" style="margin-top:8px">
    <div><h1>${editando ? 'Tus datos' : 'Bienvenido'}</h1>
      <p class="small muted" style="margin:4px 0 0">Se guardan en este celular y se usan en cada inspección que registres.</p></div>
    <div><span class="lbl">Cargo</span>${segc(CARGOS, S.cargoTmp, 'elegirCargo', 'cargoSel')}</div>
    <div><label class="lbl" for="nombreIn">Nombre completo</label>
      <input class="t" id="nombreIn" autocomplete="name" placeholder="Ej: Juan Pérez" value="${esc(ME.nombre)}"></div>
    <button class="btn" data-act="guardarPerfil">${editando ? 'Guardar' : 'Continuar'}</button>
    ${editando ? '<button class="btn sec" data-act="cancelarPerfil">Cancelar</button>' : ''}
  </div>`;
}

function vInicio() {
  const h = toISO(hoy()), lunes = lunesISO(hoy());
  const deHoy = activos().filter(r => r.fecha === h).sort((a, b) => (a.hora || '') < (b.hora || '') ? 1 : -1);
  return `
  <section class="hero">
    <p class="saludo">Hola, ${esc(ME.nombre.split(' ')[0])}</p>
    <h1>${DIAS[diaNum(hoy()) - 1]} ${parseISO(h).getDate()} de ${['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'][parseISO(h).getMonth()]}</h1>
    <p class="small muted">Día ${diaNum(hoy())} de la semana del ${fmtC(lunes)} al ${fmtC(fechasSemana(lunes)[6])}</p>
  </section>
  ${CONFIG.CARROS.map(c => {
    const rs = recsDia(c, h), ult = rs[rs.length - 1];
    const estado = !rs.length ? '<span class="estado pend">Pendiente hoy</span>'
      : rs.some(tieneM) ? `<span class="estado bad">Con novedades hoy</span>` : `<span class="estado ok">Revisado hoy</span>`;
    return `<article class="card carro">
      <div class="carro-h">
        <div><h2>Carro ${esc(c)}</h2><p class="xs muted">${rs.length ? `Última inspección a las ${hora12(ult.hora)}` : 'Aún no se inspecciona hoy'}</p></div>
        ${estado}
      </div>
      ${tiraDias(c, lunes)}
      <div class="carro-a">
        <button class="btn" data-act="nuevo" data-carro="${esc(c)}">Iniciar inspección</button>
        <button class="btn sec sm" data-act="verSemana" data-carro="${esc(c)}">Semana</button>
      </div>
    </article>`;
  }).join('')}
  <section class="card lista">
    <h2>Inspecciones de hoy</h2>
    ${deHoy.length ? deHoy.map(r => filaInsp(r, { carro: true })).join('') : '<p class="empty">Todavía no hay inspecciones hoy. Empieza con el botón del carro que vas a revisar.</p>'}
  </section>

/* ---------- Hoja semanal ---------- */
const columnas = (carro, lunes) => fechasSemana(lunes).flatMap((f, i) => {
  const rs = recsDia(carro, f);
  return rs.length ? rs.map(r => ({ f, i, r })) : [{ f, i, r: null }];
});
function tablaSemana(carro, lunes) {
  const h = toISO(hoy()), cols = columnas(carro, lunes);
  const vacia = c => `<td class="${c.f > h ? 'fut' : ''}"></td>`;
  const celda = (c, id) => {
    if (!c.r) return vacia(c);
    const v = c.r.items[id] || '';
    const foto = (c.r.fotos && c.r.fotos[id] && c.r.fotos[id].length) ? ' cf' : '';
    return `<td class="v${v}${foto}">${v === 'NA' ? 'N/A' : v}</td>`;
  };
  const span = cols.length + 1;
  let html = `<div class="tabla-wrap"><table class="hoja" style="min-width:${128 + cols.length * 46}px"><thead><tr><th class="desc">Descripción</th>${cols.map(c =>
    `<th class="${c.f === h ? 'hoy' : ''}" data-act="${c.r ? 'ver' : c.f > h ? '' : 'nuevo'}" data-id="${c.r ? esc(c.r.id) : ''}" data-carro="${esc(carro)}" data-fecha="${c.f}">Día ${c.i + 1}<small>${DIAS_C[c.i]} ${parseISO(c.f).getDate()}</small><small>${c.r ? esc(c.r.hora || '') : '&nbsp;'}</small></th>`).join('')}</tr></thead><tbody>`;
  SECCIONES.forEach((s, si) => {
    html += `<tr class="sec"><td colspan="${span}">${si + 1}. ${esc(s.t)}</td></tr>`;
    s.items.forEach(([id, lab]) => {
      html += `<tr><td class="desc">${esc(lab)}</td>${cols.map(c => celda(c, id)).join('')}</tr>`;
      if (id === 'desinfeccion') html += `<tr><td class="desc xs muted">Realizada AM / PM</td>${cols.map(c => c.r ? `<td class="xs">${[c.r.desinfAM && 'AM', c.r.desinfPM && 'PM'].filter(Boolean).join(' ') || '—'}</td>` : vacia(c)).join('')}</tr>`;
    });
  });
  html += `<tr class="sec"><td colspan="${span}">Responsable</td></tr><tr><td class="desc">Iniciales</td>${cols.map(c => c.r ? `<td class="xs" title="${esc(quien(c.r))}">${esc(iniciales(c.r.camarero))}</td>` : vacia(c)).join('')}</tr>`;
  return html + `</tbody></table></div>`;
}

      <div class="small muted">Inspecciones en este celular: ${activos().length}<br>Pendientes por enviar: ${pendientes()}<br>Base compartida: ${conectado() ? 'conectada' : 'no configurada'}</div>

/* ================== RENDER ================== */
function guardarAbiertos() {
  document.querySelectorAll('main details[data-key]').forEach(d => { S.acc = S.acc || {}; S.acc[S.view + d.dataset.key] = d.open; });
}
function render(conservar) {
  const main = $('#main');
  if (conservar) guardarAbiertos();
  if (!ME.nombre || !ME.cargo || S.view === 'perfil') {
    if (S.cargoTmp === undefined) S.cargoTmp = ME.cargo || '';
    main.innerHTML = vPerfil(); $('#savebarHost').innerHTML = ''; const yo0 = $('#yoBtn'); if (yo0) yo0.textContent = iniciales(ME.nombre);
    document.querySelectorAll('#nav button').forEach(b => b.classList.remove('on')); pintarSync(); return;
  }
  if (S.view === 'form' && !S.draft) nuevoDraft(CONFIG.CARROS[0], toISO(hoy()));
  main.innerHTML = { inicio: vInicio, form: vForm, semana: vSemana, admin: vAdmin, ver: vDetalle }[S.view]();
  const yo = $('#yoBtn'); if (yo) yo.textContent = iniciales(ME.nombre);
  if (conservar && S.acc) main.querySelectorAll('details[data-key]').forEach(d => { const k = S.view + d.dataset.key; if (k in S.acc) d.open = S.acc[k]; });
  $('#savebarHost').innerHTML = S.view === 'form' ? savebarHTML() : '';
  const tab = S.view === 'ver' ? S.prevView : S.view === 'form' && S.draft && S.draft._existe ? S.prevView : S.view;
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.nav === tab));
  hidratarFotos(main);
  pintarSync();
}
function ir(view) { if (view !== 'ver' && view !== 'form') S.prevView = view; S.view = view; S.acc = {}; render(); window.scrollTo(0, 0); }
function ver(id) { if (S.view !== 'ver' && S.view !== 'form') S.prevView = S.view; S.verId = id; S.view = 'ver'; S.acc = {}; render(); window.scrollTo(0, 0); }

/* ================== FORMULARIO: lógica ================== */
function nuevoDraft(carro, fecha) {
  S.draft = {
    id: uid(), carro, fecha, semana: lunesISO(parseISO(fecha)), dia: diaNum(parseISO(fecha)),
    hora: fecha === toISO(hoy()) ? ahoraHM() : '',
    camarero: ME.nombre, cargo: ME.cargo || '', items: {}, obsItems: {}, fotos: {},
    desinfAM: false, desinfPM: false, obs: '', _existe: false
  };
  S.abiertas = new Set([0]); S.dirty = false;
}
function editar(id) {
  const ex = DB[id]; if (!ex) return;
  if (!puedeEditar(ex)) { toast('Solo quien registró la inspección puede editarla'); return; }
  const d = JSON.parse(JSON.stringify(ex));
  d.items = d.items || {}; d.obsItems = d.obsItems || {}; d.fotos = d.fotos || {};
  d._existe = true; delete d._pending;
  S.draft = d; S.abiertas = new Set(); S.dirty = false; ir('form');
}
function cambiarFecha(fecha) {
  const d = S.draft;
  d.fecha = fecha; d.semana = lunesISO(parseISO(fecha)); d.dia = diaNum(parseISO(fecha));
  S.dirty = true; render();
}
function actualizarProg() {
  const n = ITEMS.filter(([id]) => S.draft.items[id]).length;
  const p = $('#prog'); if (p) p.textContent = `${n} de ${ITEMS.length}`;
  const b = $('#progBar'); if (b) b.style.width = Math.round(n / ITEMS.length * 100) + '%';
}
function actualizarSeccion(i) {
  const s = SECCIONES[i], d = S.draft;
  const ic = $('#sic-' + i), sub = $('#ssub-' + i);
  if (ic) ic.innerHTML = iconoSec(s, d);
  if (sub) sub.textContent = subSec(s, d);
}
const seccionDe = id => SECCIONES.findIndex(s => s.items.some(([k]) => k === id));
function pintarExtra(id) {
  const ex = $('#ex-' + id); if (!ex) return;
  ex.innerHTML = extraHTML(id, S.draft); hidratarFotos(ex);
  const cam = document.querySelector(`#it-${id} .cam`); if (cam) cam.classList.toggle('has', (S.draft.fotos[id] || []).length > 0);
}
function setVal(id, v, auto) {
  const d = S.draft, antes = d.items[id];
  d.items[id] = v; S.dirty = true;
  const el = $('#it-' + id); if (!el) return;
  el.classList.remove('falta');
  el.querySelectorAll('.opts button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  if ((antes === 'M') !== (v === 'M')) { pintarExtra(id); if (v === 'M' && !auto) { const inp = el.querySelector('[data-obs]'); if (inp) inp.focus({ preventScroll: true }); } }
  const i = seccionDe(id);
  actualizarSeccion(i); actualizarProg();
  if (!auto && respondidosSec(SECCIONES[i], d) === SECCIONES[i].items.length && v !== 'M') avanzarDesde(i);
}
function avanzarDesde(i) {
  const d = S.draft;
  const sig = SECCIONES.findIndex((s, k) => k > i && respondidosSec(s, d) < s.items.length);
  if (sig < 0) return;
  const actual = document.querySelector(`details[data-sec="${i}"]`), nueva = document.querySelector(`details[data-sec="${sig}"]`);
  setTimeout(() => {
    if (actual && !actual.querySelector('.item [data-obs]')) actual.open = false;
    if (nueva) { nueva.open = true; nueva.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  }, 250);
}
async function agregarFotos(id, files) {
  const d = S.draft;
  for (const file of files) {
    try {
      const data = await comprimir(file);
      const fid = uid();
      await fotosDB.set(fid, data);
      fotoCache[fid] = data;
      (d.fotos[id] = d.fotos[id] || []).push({ id: fid });
      S.dirty = true;
    } catch (e) { toast('No se pudo agregar la foto'); }
  }
  pintarExtra(id);
}
function guardar() {
  const d = S.draft;
  if (!d.hora) { toast('Indica la hora de la inspección'); $('#fHora').focus(); return; }
  const faltan = ITEMS.filter(([id]) => !d.items[id]);
  if (faltan.length) {
    faltan.forEach(([id]) => { const el = $('#it-' + id); if (el) el.classList.add('falta'); });
    const secs = new Set(faltan.map(([id]) => seccionDe(id)));
    document.querySelectorAll('details[data-sec]').forEach(x => { if (secs.has(+x.dataset.sec)) x.open = true; });
    const first = $('#it-' + faltan[0][0]);
    if (first) setTimeout(() => first.scrollIntoView({ behavior: 'smooth', block: 'center' }), 50);
    toast(`Faltan ${plural(faltan.length, 'ítem', 'ítems')} por marcar`);
    return;
  }
  Object.keys(d.obsItems).forEach(id => { if (d.items[id] !== 'M' || !d.obsItems[id].trim()) delete d.obsItems[id]; });
  Object.keys(d.fotos).forEach(id => { if (!d.fotos[id].length) delete d.fotos[id]; });
  const prev = DB[d.id];
  if (prev && prev.fotos) Object.values(prev.fotos).flat().forEach(pf => {
    Object.values(d.fotos).flat().forEach(f => { if (f.id === pf.id && pf.sub) f.sub = true; });
  });
  const now = new Date().toISOString();
  const rec = limpio(d);
  delete rec.gestor; delete rec.conductor;
  rec.actualizado = now; rec.creado = rec.creado || now; rec.dispositivo = rec.dispositivo || ME.dispositivo;
  rec._pending = true;
  DB[rec.id] = rec; persist();
  toast(d._existe ? 'Cambios guardados' : `Inspección de las ${hora12(rec.hora)} guardada`);
  S.semana = rec.semana; S.carroSemana = rec.carro; S.draft = null; S.dirty = false;
  ver(rec.id);
  sync();
}
function eliminar() {
  const d = S.draft;
  if (!confirm(`¿Eliminar la inspección del ${fmtC(d.fecha)} a las ${hora12(d.hora)}? No se puede deshacer.`)) return;
  const rec = limpio(DB[d.id] || d);
  rec.eliminado = true; rec.actualizado = new Date().toISOString(); rec._pending = true;
  DB[rec.id] = rec; persist();
  toast('Inspección eliminada');
  S.draft = null; ir(S.prevView || 'inicio'); sync();
}

/* ================== EXPORTAR ================== */
const fotosTexto = r => Object.entries(r.fotos || {}).filter(([, arr]) => arr.length).map(([id, arr]) => `${LABEL[id]}: ${plural(arr.length, 'foto', 'fotos')}`);
const novTexto = r => ITEMS.filter(([id]) => r.items[id] === 'M').map(([id, lab]) => lab + (r.obsItems && r.obsItems[id] ? ': ' + r.obsItems[id] : ''));
function hojaAOA(carro, lunes) {
  const f = fechasSemana(lunes);
  const cols = columnas(carro, lunes);
  const recs = cols.map(c => c.r).filter(Boolean);
  const aoa = [
    ['INSPECCIÓN DIARIA CARROS DE GOLF', ...Array(Math.max(0, cols.length - 1)).fill(''), 'FOR-PSB-07'],
    ['Colaboradores:', [...new Set(recs.map(quien))].join(', ')],
    ['Semana del', fmtC(f[0]), 'al', fmtC(f[6]) + ' de ' + parseISO(f[6]).getFullYear(), '', 'Carro:', carro],
    ['B - BUENO', 'M - MALA', 'NA - NO APLICA'],
    [],
    ['DESCRIPCIÓN', ...cols.map(c => `DÍA ${c.i + 1} (${DIAS_C[c.i]} ${parseISO(c.f).getDate()})${c.r ? ' ' + (c.r.hora || '') : ''}`)]
  ];
  SECCIONES.forEach((s, si) => {
    aoa.push([`${si + 1}. ${s.t}`]);
    s.items.forEach(([id, lab]) => {
      aoa.push([lab, ...cols.map(c => c.r ? (c.r.items[id] || '') : '')]);
      if (id === 'desinfeccion') aoa.push(['   Desinfección realizada (AM/PM)', ...cols.map(c => c.r ? [c.r.desinfAM && 'AM', c.r.desinfPM && 'PM'].filter(Boolean).join('-') : '')]);
    });
  });
  aoa.push(['Registró (nombre · cargo)', ...cols.map(c => c.r ? quien(c.r) : '')]);
  aoa.push([]); aoa.push(['OBSERVACIONES']);
  recs.forEach(r => {
    const nov = novTexto(r);
    if (nov.length || r.obs) aoa.push([`Día ${r.dia} (${fmtC(r.fecha)}) ${r.hora || ''} - ${quien(r)}`, [nov.join('; '), r.obs].filter(Boolean).join(' | ')]);
  });
  const fotos = recs.flatMap(r => fotosTexto(r).map(t => [`Día ${r.dia} (${fmtC(r.fecha)}) ${r.hora || ''}`, t]));
  if (fotos.length) { aoa.push([]); aoa.push(['FOTOS DE EVIDENCIA (ver en la app)']); fotos.forEach(x => aoa.push(x)); }
  return { aoa, ncols: cols.length };
}
function descargarCSV(nombre, aoa) {
  const csv = aoa.map(r => r.map(c => `"${String(c ?? '').replace(/"/g, '""')}"`).join(';')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }));
  a.download = nombre; a.click();
}
function xlsSemana() {
  const nombre = `Inspeccion_semana_${S.semana}`;
  if (!window.XLSX) { CONFIG.CARROS.forEach(c => descargarCSV(`${nombre}_${c}.csv`, hojaAOA(c, S.semana).aoa)); toast('Exportado como CSV'); return; }
  const wb = XLSX.utils.book_new();
  CONFIG.CARROS.forEach(c => {
    const { aoa, ncols } = hojaAOA(c, S.semana);
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = [{ wch: 42 }, ...Array(ncols).fill({ wch: 16 })];
    XLSX.utils.book_append_sheet(wb, ws, c.slice(0, 31));
  });
  XLSX.writeFile(wb, nombre + '.xlsx');
}
function xlsTodo() {
  const head = ['Fecha', 'Hora', 'Semana (lunes)', 'Día', 'Día semana', 'Carro', 'Nombre', 'Cargo', ...ITEMS.map(i => i[1]), 'Desinfección AM', 'Desinfección PM', 'Novedades', 'Observaciones', 'Fotos', 'Actualizado'];
  const rows = activos().sort((a, b) => (a.fecha + a.hora + a.carro) < (b.fecha + b.hora + b.carro) ? -1 : 1).map(r => [
    r.fecha, r.hora || '', r.semana, r.dia, DIAS[r.dia - 1], r.carro, r.camarero, r.cargo || '', ...ITEMS.map(([id]) => r.items[id] || ''),
    r.desinfAM ? 'Sí' : 'No', r.desinfPM ? 'Sí' : 'No', novTexto(r).join('; '),
    r.obs || '', fotosTexto(r).join('; '), r.actualizado || '']);
  if (!window.XLSX) { descargarCSV('Inspecciones_todas.csv', [head, ...rows]); return; }
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([head, ...rows]), 'Registros');
  XLSX.writeFile(wb, 'Inspecciones_todas.xlsx');
}
function printSemana() {
  const f = fechasSemana(S.semana);
  $('#print').innerHTML = CONFIG.CARROS.map(c => {
    const cols = columnas(c, S.semana);
    const recs = cols.map(x => x.r).filter(Boolean);
    let rows = '';
    SECCIONES.forEach((s, si) => {
      rows += `<tr class="s"><td colspan="${cols.length + 1}">${si + 1}. ${esc(s.t)}</td></tr>`;
      s.items.forEach(([id, lab]) => {
        rows += `<tr><td class="d">${esc(lab)}</td>${cols.map(x => `<td>${x.r ? (x.r.items[id] || '') + (id === 'desinfeccion' ? ' <small>' + [x.r.desinfAM && 'am', x.r.desinfPM && 'pm'].filter(Boolean).join('-') + '</small>' : '') : ''}</td>`).join('')}</tr>`;
      });
    });
    const obs = recs.map(r => {
      const nov = novTexto(r);
      return (nov.length || r.obs) ? `<div>Día ${r.dia} (${fmtC(r.fecha)}) ${esc(r.hora || '')} – ${esc(quien(r))}: ${esc([nov.join('; '), r.obs].filter(Boolean).join(' | '))}</div>` : '';
    }).join('');
    return `<div class="pg"><h1>INSPECCIÓN DIARIA CARROS DE GOLF</h1>
      <div class="hdr"><span>Colaboradores: <b>${esc([...new Set(recs.map(quien))].join(', '))}</b></span><span>Carro: <b>${esc(c)}</b></span></div>
      <div class="hdr"><span>Semana del <b>${fmtC(f[0])}</b> al <b>${fmtC(f[6])}</b> de ${parseISO(f[6]).getFullYear()}</span><span>B - BUENO &nbsp; M - MALA &nbsp; NA - NO APLICA</span></div>
      <table><tr><th>DESCRIPCIÓN</th>${cols.map(x => `<th>DÍA ${x.i + 1}<br><small>${DIAS_C[x.i]} ${parseISO(x.f).getDate()}${x.r ? ' · ' + esc(x.r.hora || '') : ''}</small></th>`).join('')}</tr>${rows}
      <tr><td class="d"><b>Registró</b></td>${cols.map(x => `<td><small>${x.r ? esc(quien(x.r)) : ''}</small></td>`).join('')}</tr></table>
      ${obs ? `<div style="margin-top:6px"><b>Observaciones:</b>${obs}</div>` : ''}
      <div style="text-align:right;margin-top:6px">FOR-PSB-07</div></div>`;
  }).join('');
  setTimeout(() => window.print(), 50);
}

/* ================== EVENTOS ================== */
async function verFoto(el) {
  const v = $('#visor'), img = v.querySelector('img');
  img.removeAttribute('src');
  v.querySelector('p').textContent = el.dataset.titulo || '';
  v.classList.add('on');
  const src = await srcFoto({ id: el.dataset.foto, sub: el.dataset.sub === '1' });
  if (src) img.src = src; else v.querySelector('p').textContent = 'Foto no disponible sin conexión';
}
document.addEventListener('click', e => {
  const nav = e.target.closest('[data-nav]');
  if (nav) {
    if (!ME.nombre || !ME.cargo || S.view === 'perfil') return;
    if (S.view === 'form' && S.dirty && !confirm('Tienes una inspección sin guardar. ¿Salir de todas formas?')) return;
    if (nav.dataset.nav === 'form' && (S.view !== 'form' || (S.draft && S.draft._existe))) nuevoDraft(CONFIG.CARROS[0], toISO(hoy()));
    return ir(nav.dataset.nav);
  }
  const b = e.target.closest('[data-act]'); if (!b) return;
  switch (b.dataset.act) {
    case 'sync': sync(false, true); break;
    case 'perfil': if (S.view === 'perfil' || !ME.nombre || !ME.cargo) break; if (S.view === 'form' && S.dirty) { toast('Guarda o cancela la inspección primero'); break; } S.prevView = ['inicio', 'semana', 'admin'].includes(S.view) ? S.view : S.prevView; S.cargoTmp = ME.cargo || ''; S.view = 'perfil'; render(); break;
    case 'elegirCargo': S.cargoTmp = b.dataset.v; b.parentNode.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); break;
    case 'guardarPerfil': {
      const n = $('#nombreIn').value.trim();
      if (!S.cargoTmp) return toast('Elige tu cargo');
      if (!n) return toast('Escribe tu nombre');
      ME.nombre = n; ME.cargo = S.cargoTmp; store.set('ig_me', ME); ir('inicio'); break;
    }
    case 'cancelarPerfil': ir(S.prevView || 'inicio'); break;
    case 'nuevo': nuevoDraft(b.dataset.carro, b.dataset.fecha || toISO(hoy())); ir('form'); break;
    case 'editar': e.preventDefault(); editar(b.dataset.id); break;
    case 'ver': e.preventDefault(); ver(b.dataset.id); break;
    case 'volver': ir(S.prevView || 'inicio'); break;
    case 'cancelarEdicion': { const id = S.draft && S.draft.id; if (S.dirty && !confirm('¿Salir sin guardar los cambios?')) return; S.draft = null; S.dirty = false; ver(id); break; }
    case 'verSemana': S.carroSemana = b.dataset.carro; S.semana = lunesISO(hoy()); ir('semana'); break;
    case 'formCarro': S.draft.carro = b.dataset.v; S.dirty = true; b.parentNode.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); break;
    case 'val': setVal(b.dataset.id, b.dataset.v); break;
    case 'seccionB': {
      const i = +b.dataset.sec;
      SECCIONES[i].items.forEach(([id]) => { if (!S.draft.items[id]) setVal(id, 'B', true); });
      avanzarDesde(i); break;
    }
    case 'desinf': S.draft[b.dataset.k] = !S.draft[b.dataset.k]; b.classList.toggle('on', S.draft[b.dataset.k]); S.dirty = true; break;
    case 'quitarFoto': {
      e.stopPropagation();
      if (!confirm('¿Quitar esta foto?')) return;
      const arr = S.draft.fotos[b.dataset.item] || [];
      S.draft.fotos[b.dataset.item] = arr.filter(f => f.id !== b.dataset.foto);
      S.dirty = true; pintarExtra(b.dataset.item); break;
    }
    case 'verFoto': verFoto(b); break;
    case 'cerrarVisor': $('#visor').classList.remove('on'); break;
    case 'guardar': guardar(); break;
    case 'eliminar': eliminar(); break;
    case 'semPrev': S.semana = toISO(addDays(parseISO(S.semana), -7)); render(true); break;
    case 'semNext': if (S.semana < lunesISO(hoy())) { S.semana = toISO(addDays(parseISO(S.semana), 7)); render(true); } break;
    case 'semCarro': S.carroSemana = b.dataset.v; render(true); break;
    case 'pin': {
      if ($('#pinIn').value === CONFIG.ADMIN_PIN) { S.admin = true; sessionStorage.setItem('ig_admin', '1'); render(); }
      else { toast('PIN incorrecto'); $('#pinIn').value = ''; } break;
    }
    case 'lock': S.admin = false; sessionStorage.removeItem('ig_admin'); render(); break;
    case 'xlsSemana': xlsSemana(); break;
    case 'xlsTodo': xlsTodo(); break;
    case 'printSemana': printSemana(); break;
    case 'syncTodo': sync(true, true); break;
  }
});
document.addEventListener('toggle', e => {
  const d = e.target;
  if (d.dataset && d.dataset.sec !== undefined) { const i = +d.dataset.sec; d.open ? S.abiertas.add(i) : S.abiertas.delete(i); }
}, true);
document.addEventListener('input', e => {
  const t = e.target;
  if (!S.draft) return;
  if (t.dataset.field) { S.draft[t.dataset.field] = t.value; S.dirty = true; }
  if (t.dataset.obs) { S.draft.obsItems[t.dataset.obs] = t.value; S.dirty = true; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'fFecha' && t.value) cambiarFecha(t.value > toISO(hoy()) ? toISO(hoy()) : t.value);
  if (t.dataset.fotoitem && t.files && t.files.length) { agregarFotos(t.dataset.fotoitem, [...t.files]); t.value = ''; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'pinIn') document.querySelector('[data-act="pin"]').click();
  if (e.key === 'Enter' && e.target.id === 'nombreIn') document.querySelector('[data-act="guardarPerfil"]').click();
  if (e.key === 'Escape') $('#visor').classList.remove('on');
});
window.addEventListener('beforeunload', e => { if (S.view === 'form' && S.dirty) { e.preventDefault(); e.returnValue = ''; } });
window.addEventListener('online', () => sync());
window.addEventListener('offline', pintarSync);
document.addEventListener('visibilitychange', () => { if (!document.hidden) sync(); });
setInterval(() => { if (!document.hidden) sync(); }, 120000);

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
render();
sync();
</script>
