<style>
:root{
  --bg:#f3f5f4; --card:#ffffff; --text:#14201b; --muted:#66756e; --line:#dfe5e2;
  --brand:#1f6f54; --brand-2:#e6f2ec; --brand-text:#ffffff;
  --b:#1f8a4c; --b-bg:#e3f5ea; --m:#c62f2f; --m-bg:#fde8e8; --na:#5b6b80; --na-bg:#e9eef5;
  --warn:#b7791f; --shadow:0 1px 3px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.04);
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1513; --card:#18211d; --text:#e7efeb; --muted:#93a39b; --line:#2a3631;
    --brand:#3fae84; --brand-2:#1d2f28; --brand-text:#0b1511;
    --b:#4cc985; --b-bg:#173226; --m:#ff6b6b; --m-bg:#3a1d1d; --na:#9fb0c6; --na-bg:#222b37;
    --shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
header.top h1{font-size:18px;margin:0;flex:1;letter-spacing:-.2px}
header.top h1 small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 10px;font-size:12px;display:flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.pill.ok i{background:var(--b)} .pill.error i{background:var(--m)} .pill.sync i{background:var(--warn);animation:blink 1s infinite} .pill.offline i{background:var(--warn)}
@keyframes blink{50%{opacity:.3}}
main{padding:14px 16px calc(150px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav.bottom button{flex:1;background:none;border:0;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);cursor:pointer}
nav.bottom button svg{width:24px;height:24px}
nav.bottom button.on{color:var(--brand);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
h2{font-size:22px;margin:4px 0 2px;letter-spacing:-.3px}
h3{font-size:15px;margin:0 0 8px}
.muted{color:var(--muted)} .small{font-size:13px}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;background:var(--brand);color:var(--brand-text);cursor:pointer;width:100%;font-size:16px}
.btn.sec{background:var(--brand-2);color:var(--brand)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}

input.t,textarea.t,select.t{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:11px 12px;font-size:16px;outline:none;-webkit-appearance:none;appearance:none;min-height:46px}
input.t:focus,textarea.t:focus{border-color:var(--brand)}
textarea.t{min-height:76px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tabs{display:flex;background:var(--brand-2);border-radius:12px;padding:4px;gap:4px}
.tabs button{flex:1;border:0;background:transparent;border-radius:9px;padding:10px;font-weight:600;color:var(--brand);cursor:pointer}
.tabs button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.dots{display:flex;gap:6px;margin:10px 0}
.dot{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.dot b{display:block;height:28px;border-radius:8px;margin-bottom:3px;border:2px solid transparent;background:var(--line);font-size:12px;line-height:24px;color:#fff}
.dot.ok b{background:var(--b)} .dot.mal b{background:var(--m)} .dot.falta b{background:transparent;border:2px dashed var(--m)}

.insp{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}

.thumb .x{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:22px;padding:0;cursor:pointer}

table.hoja th,table.hoja td{border-bottom:1px solid var(--line);border-left:1px solid var(--line);padding:6px 2px;text-align:center;overflow:hidden;text-overflow:ellipsis;position:relative}

@media (min-width:600px){table.hoja td.desc,table.hoja th.desc{width:220px;font-size:13px}}
table.hoja th{font-size:12px;background:var(--brand-2);color:var(--brand);cursor:pointer;line-height:1.2}
table.hoja th small{display:block;font-weight:500;font-size:10px}
table.hoja th.g1{background:var(--bg)}
table.hoja th.hoy{background:var(--brand);color:var(--brand-text)}
table.hoja .desc{text-align:left;position:sticky;left:0;background:var(--card);border-left:0;z-index:1}
table.hoja th.desc{background:var(--brand-2);z-index:2}
table.hoja tr.sec td{background:var(--bg);font-weight:700;text-align:left;font-size:12px;color:var(--brand);padding-left:8px}
td.vB{color:var(--b);font-weight:700} td.vM{color:#fff;background:var(--m);font-weight:700} td.vNA{color:var(--na);font-weight:600}
td.cf::after{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
td.fut{background:repeating-linear-gradient(45deg,transparent,transparent 4px,var(--bg) 4px,var(--bg) 8px)}
.list-item{padding:10px 0;border-bottom:1px solid var(--line)} .list-item:last-child{border-bottom:0}
.stat{background:var(--bg);border-radius:10px;padding:10px}
.stat b{font-size:22px;display:block}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.center{text-align:center}
.pin{font-size:28px;letter-spacing:12px;text-align:center}
#visor{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:70;display:none;align-items:center;justify-content:center;padding:20px}
#visor.on{display:flex}
#visor img{max-width:100%;max-height:85vh;border-radius:8px}
#visor p{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#fff;font-size:14px;margin:0}

  @page{size:landscape;margin:10mm}
  body *{visibility:hidden}
  #print,#print *{visibility:visible}
  #print{display:block;position:absolute;left:0;top:0;width:100%;color:#000;background:#fff;font:10px Arial,sans-serif}
  #print .pg{page-break-after:always}
  #print h1{font-size:15px;text-align:center;margin:0 0 6px}
  #print table{border-collapse:collapse;width:100%}
  #print td,#print th{border:1px solid #000;padding:2px 3px;text-align:center}
  #print td.d{text-align:left}
  #print tr.s td{background:#bbb;font-weight:bold;text-align:left}
  #print .hdr{display:flex;justify-content:space-between;margin-bottom:5px}
  #print .firmas{display:flex;justify-content:space-around;margin-top:22px}
  #print .firmas div{border-top:1px solid #000;padding-top:4px;min-width:200px;text-align:center}
}
</style>

<body>

  <h1>Inspección Golf<small>Carros de golf · FOR-PSB-07</small></h1>

<nav class="bottom" id="nav">
  <button data-nav="inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</button>

</nav>

<script>
/* ================== CONFIGURACIÓN ==================
   API_URL: URL de la "Aplicación web" de Google Apps Script (ver LEEME.md).
            Si se deja vacía, la app funciona solo en este celular.
   TOKEN:   debe ser IGUAL al TOKEN de Code.gs.
   ADMIN_PIN: PIN para entrar al panel administrador.            */
const CONFIG = {
  API_URL: '',
  TOKEN: 'ig-dc789ccdbbd3b9db2d24',
  ADMIN_PIN: '1234',
  CARROS: ['Lencero', 'H5'],
  SEMANAS_SYNC: 12,
  FOTO_MAX: 1280,       // lado mayor de la foto en píxeles
  FOTO_CALIDAD: 0.7
};

/* ================== FORMULARIO (igual al papel) ================== */
const SECCIONES = [
  { t: '1. Condiciones externas del vehículo', items: [
    ['motor', 'Estado del motor'],
    ['lat_frente', 'Latonería y pintura frente'],
    ['lat_der', 'Latonería y pintura lado derecho'],
    ['lat_izq', 'Latonería y pintura lado izquierdo'],
    ['lat_tras', 'Latonería y pintura parte trasera'],
    ['lat_techo', 'Latonería y pintura techo'],
    ['llantas', 'Llantas'],
    ['llanta_rep', 'Llantas de repuesto'],
    ['direccion', 'Dirección'],
    ['suspension', 'Suspensión'],
    ['retrovisores', 'Retrovisores'],
    ['gasolina', 'Nivel del tanque de gasolina']]},
  { t: '2. Condiciones internas del vehículo', items: [
    ['cojineria', 'Cojinería'],
    ['pisos', 'Pisos'],
    ['techo', 'Techo']]},
  { t: '3. Condiciones operativas del vehículo', items: [
    ['aceite', 'Aceite'],
    ['bateria', 'Batería'],
    ['pito', 'Pito'],
    ['luces', 'Luces'],
    ['encendido', 'Encendido'],
    ['pito_rev', 'Pito de reversa'],
    ['aseo', 'Condiciones de aseo'],
    ['desinfeccion', 'Desinfección am - pm'],
    ['conoc_desinf', 'Conocimiento de: desinfectar el carro cada vez que sea utilizado nuevamente por otro usuario']]},
  { t: '4. Elementos de seguridad', items: [
    ['extintor', 'Extintor']]}
];
const ITEMS = SECCIONES.flatMap(s => s.items);
const LABEL = Object.fromEntries(ITEMS);
const VALS = [['B', 'Bueno'], ['M', 'Malo'], ['NA', 'No aplica']];
const DIAS = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];
const DIAS_C = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const ICO_CAM = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></svg>';

/* ================== UTILIDADES ================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const hoy = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
const ahoraHM = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const toISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const diaNum = d => ((d.getDay() + 6) % 7) + 1;           // 1 = lunes ... 7 = domingo
const lunesISO = d => toISO(addDays(d, -(diaNum(d) - 1)));
const fechasSemana = lunes => Array.from({length: 7}, (_, i) => toISO(addDays(parseISO(lunes), i)));
const fmtC = iso => { const d = parseISO(iso); return `${d.getDate()} ${MESES[d.getMonth()]}`; };
const fmtL = iso => { const d = parseISO(iso); return `${DIAS[diaNum(d) - 1]} ${d.getDate()} ${MESES[d.getMonth()]} ${d.getFullYear()}`; };
const hora12 = hm => { if (!hm) return '—'; const [h, m] = hm.split(':').map(Number); return `${((h + 11) % 12) + 1}:${pad(m)} ${h < 12 ? 'a. m.' : 'p. m.'}`; };
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const iniciales = n => (n || '').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('');
const store = {
  get(k, def) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch (e) { return def; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
};
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ================== FOTOS (IndexedDB) ================== */
const fotosDB = (() => {
  let dbp;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('ig_fotos', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('f');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const tx = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => {
    const t = db.transaction('f', mode); const req = fn(t.objectStore('f'));
    t.oncomplete = () => res(req && req.result); t.onerror = () => rej(t.error); }); };
  return { get: k => tx('readonly', s => s.get(k)).catch(() => null), set: (k, v) => tx('readwrite', s => s.put(v, k)), del: k => tx('readwrite', s => s.delete(k)).catch(() => {}) };
})();
const fotoCache = {};
const urlDrive = id => `https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w1280`;
async function srcFoto(f) {
  if (fotoCache[f.id]) return fotoCache[f.id];
  const local = await fotosDB.get(f.id);
  if (local) return (fotoCache[f.id] = local);
  return f.drive ? urlDrive(f.drive) : '';
}
function hidratarFotos(root = document) {
  root.querySelectorAll('img[data-foto]:not([data-ok])').forEach(async img => {
    img.dataset.ok = '1';
    const src = await srcFoto({ id: img.dataset.foto, drive: img.dataset.drive });
    if (src) img.src = src;
    img.onerror = () => { if (img.dataset.drive && !img.dataset.alt) { img.dataset.alt = '1'; img.src = `https://lh3.googleusercontent.com/d/${img.dataset.drive}=w1280`; } };
  });
}
function comprimir(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const k = Math.min(1, CONFIG.FOTO_MAX / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', CONFIG.FOTO_CALIDAD));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('No se pudo leer la imagen')); };
    img.src = url;
  });
}

/* ================== SINCRONIZACIÓN ================== */
let syncing = false, otraVez = false;
function setSync(cls, txt) { const p = $('#syncPill'); p.className = 'pill ' + cls; p.querySelector('span').textContent = txt; }
function pintarSync() {
  const n = pendientes();
  if (!CONFIG.API_URL) return setSync('', 'Solo local');
  if (!navigator.onLine) return setSync('offline', n ? `Sin red · ${n} pend.` : 'Sin red');
  if (n) return setSync('offline', `${n} pendiente${n > 1 ? 's' : ''}`);
  setSync('ok', 'Sincronizado');
}
const limpio = r => { const c = JSON.parse(JSON.stringify(r)); delete c._pending; delete c._existe; return c; };
async function apiPost(body) {
  const r = await fetch(CONFIG.API_URL, { method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify({...body, token: CONFIG.TOKEN}) });
  return r.json();
}
async function apiGet(params) {
  const q = new URLSearchParams({...params, token: CONFIG.TOKEN});
  const r = await fetch(CONFIG.API_URL + '?' + q.toString());
  return r.json();
}
async function subirFotos(rec) {
  for (const [item, arr] of Object.entries(rec.fotos || {})) {
    for (const f of arr) {
      if (f.drive) continue;
      const data = await fotosDB.get(f.id);
      if (!data) continue;
      const res = await apiPost({ action: 'foto', id: f.id, nombre: `${rec.carro}_${rec.fecha}_${(rec.hora || '').replace(':', '')}_${item}_${f.id}.jpg`, data: data.split(',')[1] });
      if (!res.ok) throw new Error(res.error || 'No se pudo subir una foto');
      f.drive = res.driveId; persist();
    }
  }
}
async function sync(todo = false, avisar = false) {
  if (!CONFIG.API_URL) { pintarSync(); if (avisar) toast('Sin base conjunta configurada: los datos quedan en este celular'); return; }
  if (!navigator.onLine) { pintarSync(); if (avisar) toast('Sin conexión. Se enviará al volver la red'); return; }
  if (syncing) { otraVez = true; return; }
  syncing = true; otraVez = false; setSync('sync', 'Sincronizando…');
  try {
    const pend = Object.values(DB).filter(r => r._pending);
    for (const r of pend) await subirFotos(r);
    if (pend.length) {
      const enviados = Object.fromEntries(pend.map(r => [r.id, r.actualizado]));
      const res = await apiPost({ action: 'upsert', records: pend.map(limpio) });
      if (!res.ok) throw new Error(res.error);
      (res.guardados || []).forEach(id => { if (DB[id] && DB[id].actualizado === enviados[id]) delete DB[id]._pending; });
      persist();
    }
    const desde = todo ? '' : toISO(addDays(parseISO(lunesISO(hoy())), -7 * CONFIG.SEMANAS_SYNC));
    const res2 = await apiGet({ action: 'list', desde });
    if (!res2.ok) throw new Error(res2.error);
    (res2.records || []).forEach(r => {
      const l = DB[r.id];
      if (!l || (!l._pending && r.actualizado >= l.actualizado)) DB[r.id] = r;
    });
    persist();
    S.ultimaSync = new Date().toISOString(); store.set('ig_lastsync', S.ultimaSync);
    pintarSync();
    if (avisar) toast('Datos sincronizados');
    if (S.view !== 'form') render();
  } catch (e) {
    console.warn(e); setSync('error', 'Error de sync');
    if (avisar) toast('No se pudo sincronizar: ' + e.message);
  } finally { syncing = false; if (otraVez) setTimeout(() => sync(todo), 300); }
}

/* Columnas de la hoja: una por inspección (agrupadas por día); día sin registro = columna vacía */
const columnas = (carro, lunes) => fechasSemana(lunes).flatMap((f, i) => {
  const rs = recsDia(carro, f);
  return rs.length ? rs.map(r => ({ f, i, r })) : [{ f, i, r: null }];
});
function tablaSemana(carro, lunes) {
  const h = toISO(hoy()), cols = columnas(carro, lunes);
  const vacia = c => `<td class="${c.f > h ? 'fut' : ''}"></td>`;
  const celda = (c, id) => {
    if (!c.r) return vacia(c);
    const v = c.r.items[id] || '';
    const foto = (c.r.fotos && c.r.fotos[id] && c.r.fotos[id].length) ? ' cf' : '';
    return `<td class="v${v}${foto}">${v === 'NA' ? 'N/A' : v}</td>`;
  };
  let html = `<div class="tabla-wrap"><table class="hoja" style="min-width:${124 + cols.length * 44}px"><thead><tr><th class="desc">Descripción</th>${cols.map(c =>
    `<th class="g${c.i % 2}${c.f === h ? ' hoy' : ''}" data-act="${c.r ? 'editar' : c.f > h ? '' : 'nuevo'}" data-id="${c.r ? esc(c.r.id) : ''}" data-carro="${esc(carro)}" data-fecha="${c.f}">Día ${c.i + 1}<small>${DIAS_C[c.i]} ${parseISO(c.f).getDate()}</small><small>${c.r ? esc(c.r.hora || '') : '&nbsp;'}</small></th>`).join('')}</tr></thead><tbody>`;
  const span = cols.length + 1;
  SECCIONES.forEach(s => {
    html += `<tr class="sec"><td colspan="${span}">${esc(s.t)}</td></tr>`;
    s.items.forEach(([id, lab]) => {
      html += `<tr><td class="desc">${esc(lab)}</td>${cols.map(c => celda(c, id)).join('')}</tr>`;
      if (id === 'desinfeccion') html += `<tr><td class="desc small muted">↳ Realizada AM / PM</td>${cols.map(c => c.r ? `<td class="small">${[c.r.desinfAM && 'AM', c.r.desinfPM && 'PM'].filter(Boolean).join(' ') || '—'}</td>` : vacia(c)).join('')}</tr>`;
    });
  });
  html += `<tr class="sec"><td colspan="${span}">Camarero</td></tr><tr><td class="desc">Registró</td>${cols.map(c => c.r ? `<td class="small" title="${esc(c.r.camarero)}">${esc(iniciales(c.r.camarero))}</td>` : vacia(c)).join('')}</tr>`;
  return html + `</tbody></table></div>`;
}
function observacionesSemana(carro, lunes) {
  const recs = fechasSemana(lunes).flatMap(f => recsDia(carro, f));
  const lines = recs.map(r => {
    const nov = ITEMS.filter(([id]) => r.items[id] === 'M').map(([id, lab]) => `<b style="color:var(--m)">${esc(lab)}</b>${r.obsItems && r.obsItems[id] ? ': ' + esc(r.obsItems[id]) : ''}`);

    return `<div class="list-item"><div class="small muted">Día ${r.dia} · ${fmtL(r.fecha)} · ${esc(r.hora || '')} · ${esc(r.camarero)}</div>

  return `<div class="card" style="margin-top:12px"><h3>Novedades, observaciones y fotos</h3>

}

  if (!ME.nombre) { main.innerHTML = vBienvenida(); $('#savebarHost').innerHTML = ''; return; }
  if (S.view === 'form' && !S.draft) nuevoDraft(CONFIG.CARROS[0], toISO(hoy()));
  main.innerHTML = { inicio: vInicio, form: vForm, semana: vSemana, admin: vAdmin }[S.view]();
  $('#savebarHost').innerHTML = S.view === 'form' ? savebarHTML() : '';
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.nav === S.view));
  hidratarFotos(main);
  pintarSync();
}
function ir(view) { S.view = view; render(); window.scrollTo(0, 0); }

/* ================== FORMULARIO: lógica ================== */
function nuevoDraft(carro, fecha) {
  const semana = lunesISO(parseISO(fecha));
  const prev = activos().filter(r => r.carro === carro && r.semana === semana).sort((a, b) => (a.fecha + a.hora) < (b.fecha + b.hora) ? 1 : -1)[0];
  S.draft = {
    id: uid(), carro, fecha, semana, dia: diaNum(parseISO(fecha)),
    hora: fecha === toISO(hoy()) ? ahoraHM() : '',
    camarero: ME.nombre, items: {}, obsItems: {}, fotos: {},
    desinfAM: false, desinfPM: false, obs: '',
    gestor: prev ? prev.gestor || '' : '', conductor: prev ? prev.conductor || '' : '',
    _existe: false
  };
  S.dirty = false;
}
function editar(id) {
  const ex = DB[id]; if (!ex) return;
  const d = JSON.parse(JSON.stringify(ex));
  d.items = d.items || {}; d.obsItems = d.obsItems || {}; d.fotos = d.fotos || {};
  d._existe = true; delete d._pending;
  S.draft = d; S.dirty = false; ir('form');
}
function cambiarFecha(fecha) {
  const d = S.draft;
  d.fecha = fecha; d.semana = lunesISO(parseISO(fecha)); d.dia = diaNum(parseISO(fecha));
  S.dirty = true; render();
}
function actualizarProg() { const p = $('#prog'); if (p) p.textContent = `${ITEMS.filter(([id]) => S.draft.items[id]).length}/${ITEMS.length}`; }
function setVal(id, v) {
  const d = S.draft; d.items[id] = v; S.dirty = true;
  const el = $('#it-' + id); if (!el) return;
  el.classList.remove('falta');
  el.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  el.querySelector('.obs-item').hidden = v !== 'M';
  actualizarProg();
}
function pintarFotosItem(id) {
  const box = $('#fotos-' + id); if (!box) return;
  box.innerHTML = fotosItemHTML(id, S.draft); hidratarFotos(box);
}
async function agregarFotos(id, files) {
  const d = S.draft;
  for (const file of files) {
    try {
      const data = await comprimir(file);
      const fid = uid();
      await fotosDB.set(fid, data);
      fotoCache[fid] = data;
      (d.fotos[id] = d.fotos[id] || []).push({ id: fid });
      S.dirty = true;
    } catch (e) { toast('No se pudo agregar la foto'); }
  }
  pintarFotosItem(id);
}
function guardar() {
  const d = S.draft;
  if (!d.camarero.trim()) { toast('Escribe el nombre del camarero'); $('#fCamarero').focus(); return; }
  if (!d.hora) { toast('Indica la hora de la inspección'); $('#fHora').focus(); return; }
  const faltan = ITEMS.filter(([id]) => !d.items[id]);
  if (faltan.length) {
    faltan.forEach(([id]) => { const el = $('#it-' + id); if (el) el.classList.add('falta'); });
    const first = $('#it-' + faltan[0][0]);
    if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
    toast(`Faltan ${faltan.length} ítem${faltan.length > 1 ? 's' : ''} por marcar`);
    return;
  }
  Object.keys(d.obsItems).forEach(id => { if (d.items[id] !== 'M' || !d.obsItems[id].trim()) delete d.obsItems[id]; });
  Object.keys(d.fotos).forEach(id => { if (!d.fotos[id].length) delete d.fotos[id]; });
  // conserva los enlaces de Drive de fotos que se subieron mientras se editaba
  const prev = DB[d.id];
  if (prev && prev.fotos) Object.values(prev.fotos).flat().forEach(pf => {
    Object.values(d.fotos).flat().forEach(f => { if (f.id === pf.id && pf.drive) f.drive = pf.drive; });
  });
  const now = new Date().toISOString();
  const rec = limpio(d);
  rec.camarero = rec.camarero.trim();
  rec.actualizado = now; rec.creado = rec.creado || now; rec.dispositivo = ME.dispositivo;
  rec._pending = true;
  DB[rec.id] = rec; persist();
  toast(d._existe ? 'Inspección actualizada' : `Inspección de las ${hora12(rec.hora)} guardada`);
  S.semana = rec.semana; S.carroSemana = rec.carro; S.draft = null; S.dirty = false;
  ir('semana');
  sync();
}
function eliminar() {
  const d = S.draft;
  if (!confirm(`¿Eliminar la inspección del ${fmtC(d.fecha)} a las ${hora12(d.hora)}? Esta acción no se puede deshacer.`)) return;
  const rec = limpio(DB[d.id] || d);
  rec.eliminado = true; rec.actualizado = new Date().toISOString(); rec._pending = true;
  DB[rec.id] = rec; persist();
  toast('Inspección eliminada');
  S.draft = null; ir('semana'); sync();
}

/* ================== EXPORTAR ================== */
const fotosTexto = r => Object.entries(r.fotos || {}).flatMap(([id, arr]) => arr.filter(f => f.drive).map(f => `${LABEL[id]}: https://drive.google.com/file/d/${f.drive}/view`));
const novTexto = r => ITEMS.filter(([id]) => r.items[id] === 'M').map(([id, lab]) => lab + (r.obsItems && r.obsItems[id] ? ': ' + r.obsItems[id] : ''));
function hojaAOA(carro, lunes) {
  const f = fechasSemana(lunes);
  const cols = columnas(carro, lunes);
  const recs = cols.map(c => c.r).filter(Boolean);
  const cams = [...new Set(recs.map(r => r.camarero))].join(', ');
  const firm = recs.slice().reverse();
  const aoa = [
    ['INSPECCIÓN DIARIA CARROS DE GOLF', ...Array(Math.max(0, cols.length - 1)).fill(''), 'FOR-PSB-07'],
    ['Nombre del colaborador:', cams],
    ['Semana del', fmtC(f[0]), 'al', fmtC(f[6]) + ' de ' + parseISO(f[6]).getFullYear(), '', 'Carro:', carro],
    ['B - BUENO', 'M - MALA', 'NA - NO APLICA'],
    [],
    ['DESCRIPCIÓN', ...cols.map(c => `DÍA ${c.i + 1} (${DIAS_C[c.i]} ${parseISO(c.f).getDate()})${c.r ? ' ' + (c.r.hora || '') : ''}`)]
  ];
  SECCIONES.forEach(s => {
    aoa.push([s.t]);
    s.items.forEach(([id, lab]) => {
      aoa.push([lab, ...cols.map(c => c.r ? (c.r.items[id] || '') : '')]);
      if (id === 'desinfeccion') aoa.push(['   Desinfección realizada (AM/PM)', ...cols.map(c => c.r ? [c.r.desinfAM && 'AM', c.r.desinfPM && 'PM'].filter(Boolean).join('-') : '')]);
    });
  });
  aoa.push(['Camarero que registró', ...cols.map(c => c.r ? c.r.camarero : '')]);
  aoa.push([]); aoa.push(['OBSERVACIONES']);
  recs.forEach(r => {
    const nov = novTexto(r);
    if (nov.length || r.obs) aoa.push([`Día ${r.dia} (${fmtC(r.fecha)}) ${r.hora || ''} - ${r.camarero}`, [nov.join('; '), r.obs].filter(Boolean).join(' | ')]);
  });
  const fotos = recs.flatMap(r => fotosTexto(r).map(t => [`Día ${r.dia} (${fmtC(r.fecha)}) ${r.hora || ''}`, t]));
  if (fotos.length) { aoa.push([]); aoa.push(['FOTOS DE EVIDENCIA']); fotos.forEach(x => aoa.push(x)); }
  aoa.push([]);
  aoa.push(['GESTOR ALOJAMIENTO:', (firm.find(r => r.gestor) || {}).gestor || '', '', '', 'CONDUCTOR:', (firm.find(r => r.conductor) || {}).conductor || '']);
  return { aoa, ncols: cols.length };
}
function descargarCSV(nombre, aoa) {
  const csv = aoa.map(r => r.map(c => `"${String(c ?? '').replace(/"/g, '""')}"`).join(';')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }));
  a.download = nombre; a.click();
}
function xlsSemana() {
  const nombre = `Inspeccion_semana_${S.semana}`;
  if (!window.XLSX) { CONFIG.CARROS.forEach(c => descargarCSV(`${nombre}_${c}.csv`, hojaAOA(c, S.semana).aoa)); toast('Exportado como CSV'); return; }
  const wb = XLSX.utils.book_new();
  CONFIG.CARROS.forEach(c => {
    const { aoa, ncols } = hojaAOA(c, S.semana);
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = [{ wch: 42 }, ...Array(ncols).fill({ wch: 16 })];
    XLSX.utils.book_append_sheet(wb, ws, c.slice(0, 31));
  });
  XLSX.writeFile(wb, nombre + '.xlsx');
}
function xlsTodo() {
  const head = ['Fecha', 'Hora', 'Semana (lunes)', 'Día', 'Día semana', 'Carro', 'Camarero', ...ITEMS.map(i => i[1]), 'Desinfección AM', 'Desinfección PM', 'Novedades', 'Observación general', 'Fotos', 'Gestor alojamiento', 'Conductor', 'Actualizado'];
  const rows = activos().sort((a, b) => (a.fecha + a.hora + a.carro) < (b.fecha + b.hora + b.carro) ? -1 : 1).map(r => [
    r.fecha, r.hora || '', r.semana, r.dia, DIAS[r.dia - 1], r.carro, r.camarero, ...ITEMS.map(([id]) => r.items[id] || ''),
    r.desinfAM ? 'Sí' : 'No', r.desinfPM ? 'Sí' : 'No', novTexto(r).join('; '),
    r.obs || '', fotosTexto(r).join('\n'), r.gestor || '', r.conductor || '', r.actualizado || '']);
  if (!window.XLSX) { descargarCSV('Inspecciones_todas.csv', [head, ...rows]); return; }
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([head, ...rows]), 'Registros');
  XLSX.writeFile(wb, 'Inspecciones_todas.xlsx');
}
function printSemana() {
  const f = fechasSemana(S.semana);
  $('#print').innerHTML = CONFIG.CARROS.map(c => {
    const cols = columnas(c, S.semana);
    const recs = cols.map(x => x.r).filter(Boolean);
    const firm = recs.slice().reverse();
    const cams = [...new Set(recs.map(r => r.camarero))].join(', ');
    let rows = '';
    SECCIONES.forEach(s => {
      rows += `<tr class="s"><td colspan="${cols.length + 1}">${esc(s.t)}</td></tr>`;
      s.items.forEach(([id, lab]) => {
        rows += `<tr><td class="d">${esc(lab)}</td>${cols.map(x => `<td>${x.r ? (x.r.items[id] || '') + (id === 'desinfeccion' ? ' <small>' + [x.r.desinfAM && 'am', x.r.desinfPM && 'pm'].filter(Boolean).join('-') + '</small>' : '') : ''}</td>`).join('')}</tr>`;
      });
    });
    const obs = recs.map(r => {
      const nov = novTexto(r);
      return (nov.length || r.obs) ? `<div>Día ${r.dia} (${fmtC(r.fecha)}) ${esc(r.hora || '')} – ${esc(r.camarero)}: ${esc([nov.join('; '), r.obs].filter(Boolean).join(' | '))}</div>` : '';
    }).join('');
    return `<div class="pg"><h1>INSPECCIÓN DIARIA CARROS DE GOLF</h1>
      <div class="hdr"><span>Nombre del colaborador: <b>${esc(cams)}</b></span><span>Carro: <b>${esc(c)}</b></span></div>
      <div class="hdr"><span>Semana del <b>${fmtC(f[0])}</b> al <b>${fmtC(f[6])}</b> de ${parseISO(f[6]).getFullYear()}</span><span>B - BUENO &nbsp; M - MALA &nbsp; NA - NO APLICA</span></div>
      <table><tr><th>DESCRIPCIÓN</th>${cols.map(x => `<th>DÍA ${x.i + 1}<br><small>${DIAS_C[x.i]} ${parseISO(x.f).getDate()}${x.r ? ' · ' + esc(x.r.hora || '') : ''}</small></th>`).join('')}</tr>${rows}
      <tr><td class="d"><b>Camarero</b></td>${cols.map(x => `<td><small>${x.r ? esc(x.r.camarero) : ''}</small></td>`).join('')}</tr></table>
      ${obs ? `<div style="margin-top:6px"><b>Observaciones:</b>${obs}</div>` : ''}
      <div class="firmas"><div>${esc((firm.find(r => r.gestor) || {}).gestor || '')}<br>GESTOR ALOJAMIENTO</div><div>${esc((firm.find(r => r.conductor) || {}).conductor || '')}<br>CONDUCTOR</div></div>
      <div style="text-align:right;margin-top:6px">FOR-PSB-07</div></div>`;
  }).join('');
  setTimeout(() => window.print(), 50);
}

/* ================== EVENTOS ================== */
async function verFoto(el) {
  const v = $('#visor'), img = v.querySelector('img');
  img.removeAttribute('src');
  v.querySelector('p').textContent = el.dataset.titulo || '';
  v.classList.add('on');
  const src = await srcFoto({ id: el.dataset.foto, drive: el.dataset.drive });
  if (src) img.src = src; else v.querySelector('p').textContent = 'Foto no disponible sin conexión';
}
document.addEventListener('click', e => {
  const nav = e.target.closest('[data-nav]');
  if (nav) {
    if (!ME.nombre) return;
    if (nav.dataset.nav === 'form' && S.view !== 'form') nuevoDraft(CONFIG.CARROS[0], toISO(hoy()));
    return ir(nav.dataset.nav);
  }
  const b = e.target.closest('[data-act]'); if (!b) return;
  switch (b.dataset.act) {
    case 'sync': sync(false, true); break;
    case 'guardarNombre': {
      const n = $('#nombreIn').value.trim(); if (!n) return toast('Escribe tu nombre');
      ME.nombre = n; store.set('ig_me', ME); S.view = 'inicio'; render(); break;
    }
    case 'cambiarNombre': {
      const n = prompt('Nombre del camarero en este celular:', ME.nombre);
      if (n && n.trim()) { ME.nombre = n.trim(); store.set('ig_me', ME); render(); } break;
    }
    case 'nuevo': nuevoDraft(b.dataset.carro, b.dataset.fecha || toISO(hoy())); ir('form'); break;
    case 'editar': editar(b.dataset.id); break;
    case 'verSemana': S.carroSemana = b.dataset.carro; S.semana = lunesISO(hoy()); ir('semana'); break;
    case 'formCarro': S.draft.carro = b.dataset.carro; S.dirty = true; render(); break;
    case 'val': setVal(b.dataset.id, b.dataset.v); break;
    case 'desinf': S.draft[b.dataset.k] = !S.draft[b.dataset.k]; b.classList.toggle('on', S.draft[b.dataset.k]); S.dirty = true; break;
    case 'todoB': ITEMS.forEach(([id]) => { if (!S.draft.items[id]) setVal(id, 'B'); }); toast('Ítems pendientes marcados en B'); break;
    case 'quitarFoto': {
      e.stopPropagation();
      if (!confirm('¿Quitar esta foto?')) return;
      const arr = S.draft.fotos[b.dataset.item] || [];
      S.draft.fotos[b.dataset.item] = arr.filter(f => f.id !== b.dataset.foto);
      S.dirty = true; pintarFotosItem(b.dataset.item); break;
    }
    case 'verFoto': verFoto(b); break;
    case 'cerrarVisor': $('#visor').classList.remove('on'); break;
    case 'guardar': guardar(); break;
    case 'eliminar': eliminar(); break;
    case 'semPrev': S.semana = toISO(addDays(parseISO(S.semana), -7)); render(); break;
    case 'semNext': if (S.semana < lunesISO(hoy())) { S.semana = toISO(addDays(parseISO(S.semana), 7)); render(); } break;
    case 'semCarro': S.carroSemana = b.dataset.carro; render(); break;
    case 'pin': {
      if ($('#pinIn').value === CONFIG.ADMIN_PIN) { S.admin = true; sessionStorage.setItem('ig_admin', '1'); render(); }
      else { toast('PIN incorrecto'); $('#pinIn').value = ''; } break;
    }
    case 'lock': S.admin = false; sessionStorage.removeItem('ig_admin'); render(); break;
    case 'xlsSemana': xlsSemana(); break;
    case 'xlsTodo': xlsTodo(); break;
    case 'printSemana': printSemana(); break;
    case 'syncTodo': sync(true, true); break;
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (!S.draft) return;
  if (t.dataset.field) { S.draft[t.dataset.field] = t.value; S.dirty = true; }
  if (t.dataset.obs) { S.draft.obsItems[t.dataset.obs] = t.value; S.dirty = true; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'fFecha' && t.value) cambiarFecha(t.value > toISO(hoy()) ? toISO(hoy()) : t.value);
  if (t.dataset.fotoitem && t.files && t.files.length) { agregarFotos(t.dataset.fotoitem, [...t.files]); t.value = ''; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'pinIn') document.querySelector('[data-act="pin"]').click();
  if (e.key === 'Enter' && e.target.id === 'nombreIn') document.querySelector('[data-act="guardarNombre"]').click();
  if (e.key === 'Escape') $('#visor').classList.remove('on');
});
window.addEventListener('beforeunload', e => { if (S.view === 'form' && S.dirty) { e.preventDefault(); e.returnValue = ''; } });
window.addEventListener('online', () => sync());
window.addEventListener('offline', pintarSync);
document.addEventListener('visibilitychange', () => { if (!document.hidden) sync(); });
setInterval(() => { if (!document.hidden) sync(); }, 120000);

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
render();
sync();
</script>
